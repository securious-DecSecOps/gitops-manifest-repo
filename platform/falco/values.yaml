# Falco Helm Chart Configuration Values for SecuBank Golden Path
# Target Namespace: falco
# Chart Version Pinning: 9.0.0

driver:
  kind: modern_ebpf

tty: true

# Prometheus 메트릭 노출 → Grafana 시각화 (보안 이벤트/룰 카운터)
metrics:
  enabled: true
  interval: 1m
  outputRule: true
  rulesCountersEnabled: true
  resourceUtilizationEnabled: true
  kernelEventCountersEnabled: true

# kube-prometheus-stack가 자동 발견하도록 ServiceMonitor 생성
serviceMonitor:
  create: true
  interval: 30s

customRules:
  vulnbank-rules.yaml: |-
    - rule: Shell spawned in VulnBank container
      desc: A shell was spawned inside a VulnBank microservice container (unauthorized terminal access)
      condition: >
        spawned_process
        and container
        and (container.image.repository contains "vulnbank" or container.name contains "vulnbank")
        and proc.name in (bash, sh, ash, zsh, ksh)
      output: >
        Shell spawned in VulnBank container (user=%user.name parent=%proc.pname cmdline=%proc.cmdline image_repo=%container.image.repository image_tag=%container.image.tag container_id=%container.id)
      priority: WARNING
      tags: [mitre_execution, vulnbank, runtime_security]

    - rule: VulnBank PHP file upload detected
      desc: A PHP file write or creation was detected inside the VulnBank web directory (potential webshell upload)
      condition: >
        open_write
        and container
        and (container.image.repository contains "vulnbank" or container.name contains "vulnbank")
        and (fd.name startswith "/var/www/html" or fd.name startswith "/usr/share/nginx/html")
        and fd.name endswith ".php"
      output: >
        PHP file upload/write detected in VulnBank web root (file=%fd.name user=%user.name proc=%proc.name cmdline=%proc.cmdline container_id=%container.id)
      priority: CRITICAL
      tags: [mitre_persistence, vulnbank, webshell_detection]
