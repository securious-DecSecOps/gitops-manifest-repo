# Falco Helm Chart Configuration Values for SecuBank Golden Path
# Target Namespace: falco
# Chart Version Pinning: 9.0.0

driver:
  kind: modern_ebpf

tty: true

falco:
  jsonOutput: true
  jsonIncludeOutputProperty: true
  jsonIncludeTagsProperty: true

# Prometheus 메트릭 노출 → Grafana 시각화 (보안 이벤트/룰 카운터)
metrics:
  enabled: true
  interval: 1m
  outputRule: true
  rulesCountersEnabled: true
  resourceUtilizationEnabled: true
  kernelEventCountersEnabled: true

# kube-prometheus-stack가 자동 발견하도록 ServiceMonitor 생성
serviceMonitor:
  create: true
  interval: 30s

customRules:
  vulnbank-rules.yaml: |-
    - rule: Shell spawned in VulnBank container
      desc: A shell was spawned inside a VulnBank microservice container (unauthorized terminal access)
      condition: >
        spawned_process
        and container
        and (container.image.repository contains "vulnbank" or container.name contains "vulnbank")
        and proc.name in (bash, sh, ash, zsh, ksh)
      output: >
        Shell spawned in VulnBank container (user=%user.name parent=%proc.pname cmdline=%proc.cmdline image_repo=%container.image.repository image_tag=%container.image.tag container_id=%container.id)
      priority: WARNING
      tags: [mitre_execution, vulnbank, runtime_security]

    - rule: VulnBank PHP file upload detected
      desc: A PHP file was written or moved into the VulnBank web directory (potential webshell upload). Covers both direct writes (open_write) and PHP move_uploaded_file (rename).
      condition: >
        container
        and (container.image.repository contains "vulnbank" or container.name contains "vulnbank")
        and (
          (open_write and fd.name endswith ".php")
          or
          (evt.type in (rename, renameat, renameat2) and evt.dir = < and fs.path.target endswith ".php")
        )
      output: >
        PHP file written/moved in VulnBank web root (file=%fd.name target=%fs.path.target user=%user.name proc=%proc.name cmdline=%proc.cmdline container_id=%container.id image=%container.image.repository:%container.image.tag k8s_pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [mitre_persistence, vulnbank, webshell_detection]
falcosidekick:
  enabled: true
  config:
    slack:
      minimumpriority: "warning"
      outputformat: "all"
    extraEnv:
      - name: SLACK_WEBHOOKURL
        valueFrom:
          secretKeyRef:
            name: falco-slack-webhook
            key: webhookurl
