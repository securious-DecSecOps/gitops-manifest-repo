apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-slack-formatter
  namespace: falco
  labels:
    app.kubernetes.io/name: falco-slack-formatter
    app.kubernetes.io/part-of: falco
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falco-slack-formatter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco-slack-formatter
        app.kubernetes.io/part-of: falco
    spec:
      containers:
        - name: formatter
          image: python:3.12-alpine
          env:
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: falco-slack-webhook
                  key: webhookurl
          ports:
            - name: http
              containerPort: 8080
          command:
            - python3
            - -c
            - |
              import json
              import os
              import urllib.request
              from http.server import BaseHTTPRequestHandler, HTTPServer

              SLACK_WEBHOOK_URL = os.environ["SLACK_WEBHOOK_URL"]

              def field(output_fields, *names, default="unknown"):
                  for name in names:
                      value = output_fields.get(name)
                      if value not in (None, ""):
                          return str(value)
                  return default

              def short(value, limit=180):
                  value = str(value)
                  return value if len(value) <= limit else value[: limit - 3] + "..."

              def mrkdwn_field(name, value):
                  return {"type": "mrkdwn", "text": f"*{name}:*\n{short(value, 120)}"}

              def send_slack(event):
                  output_fields = event.get("output_fields") or {}
                  priority = str(event.get("priority", "WARNING")).upper()
                  rule = event.get("rule", "Falco runtime event")
                  namespace = field(output_fields, "k8s.ns.name")
                  pod = field(output_fields, "k8s.pod.name")
                  container = field(output_fields, "container.name")
                  user = field(output_fields, "user.name")
                  command = field(output_fields, "proc.cmdline")
                  image = field(output_fields, "container.image.repository")
                  image_tag = field(output_fields, "container.image.tag", default="")
                  if image_tag and image_tag != "unknown":
                      image = f"{image}:{image_tag}"
                  event_time = event.get("time") or field(output_fields, "evt.time")

                  title = f"SecuBank Runtime · Falco {priority}"
                  fallback = f"{title} - {rule}"
                  payload = {
                      "text": fallback,
                      "blocks": [
                          {
                              "type": "header",
                              "text": {
                                  "type": "plain_text",
                                  "text": title,
                              },
                          },
                          {
                              "type": "section",
                              "text": {
                                  "type": "mrkdwn",
                                  "text": f"*{rule}*",
                              },
                          },
                          {
                              "type": "section",
                              "fields": [
                                  mrkdwn_field("Namespace", namespace),
                                  mrkdwn_field("Pod", pod),
                                  mrkdwn_field("Container", container),
                                  mrkdwn_field("User", user),
                                  mrkdwn_field("Command", command),
                                  mrkdwn_field("Image", image),
                              ],
                          },
                          {
                              "type": "context",
                              "elements": [
                                  {
                                      "type": "mrkdwn",
                                      "text": f"*Time:* {short(event_time, 80)}",
                                  }
                              ],
                          },
                          {
                              "type": "section",
                              "text": {
                                  "type": "mrkdwn",
                                  "text": "*Action:* Check Falco logs and DefectDojo runtime finding.",
                              },
                          },
                      ],
                  }
                  req = urllib.request.Request(
                      SLACK_WEBHOOK_URL,
                      data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      return resp.status

              class Handler(BaseHTTPRequestHandler):
                  def do_POST(self):
                      body = self.rfile.read(int(self.headers.get("Content-Length", "0")))
                      try:
                          event = json.loads(body.decode("utf-8"))
                          status = send_slack(event)
                          print(f"Falco Slack notification sent: HTTP {status}", flush=True)
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b"ok")
                      except Exception as exc:
                          print(f"Falco Slack notification failed: {exc}", flush=True)
                          self.send_response(500)
                          self.end_headers()
                          self.wfile.write(str(exc).encode("utf-8"))

                  def log_message(self, fmt, *args):
                      return

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: falco-slack-formatter
  namespace: falco
  labels:
    app.kubernetes.io/name: falco-slack-formatter
    app.kubernetes.io/part-of: falco
spec:
  selector:
    app.kubernetes.io/name: falco-slack-formatter
  ports:
    - name: http
      port: 8080
      targetPort: http
