# =============================================================================
# Cilium CNI + Hubble 관측성 Helm Values
# 대상: K3s 런타임 클러스터 (싱글 컨트롤 플레인)
#
# 전제 조건: K3s 설치 시 아래 옵션으로 Flannel CNI가 완전히 비활성화된 상태여야 합니다.
#   INSTALL_K3S_EXEC="--flannel-backend=none --disable-network-policy --disable=traefik"
# =============================================================================

# -----------------------------------------------------------------------------
# 1. K3s API Server 연동 설정
#    K3s는 싱글 컨트롤 플레인이므로 로컬호스트(127.0.0.1)에서 API 서버가 운영됩니다.
#    Cilium이 kube-apiserver에 안정적으로 bootstrap되도록 명시적으로 지정합니다.
# -----------------------------------------------------------------------------
k8sServiceHost: "127.0.0.1"
k8sServicePort: "6443"

# -----------------------------------------------------------------------------
# 2. eBPF 기반 kube-proxy 완전 대체 (kubeProxyReplacement)
#    Cilium이 iptables 대신 eBPF로 클러스터 내 서비스 라우팅을 직접 처리합니다.
#    K3s는 별도 kube-proxy를 실행하지 않으므로 "true" 설정이 안전합니다.
# -----------------------------------------------------------------------------
kubeProxyReplacement: "true"

# -----------------------------------------------------------------------------
# 3. K3s 전용 컨테이너 런타임 소켓 경로 설정
#    K3s는 기본 Docker/CRI-O가 아닌 내장 containerd를 사용하며,
#    소켓 경로가 표준 경로(/run/containerd/containerd.sock)와 다릅니다.
# -----------------------------------------------------------------------------
containerRuntime:
  integration: containerd
  socketPath: /run/k3s/containerd/containerd.sock

# -----------------------------------------------------------------------------
# 4. IP 주소 관리(IPAM) 모드
#    "kubernetes" 모드: K8s API 서버의 podCIDR 범위를 그대로 존중합니다.
#    K3s의 기본 클러스터 CIDR(10.42.0.0/16)과 호환됩니다.
# -----------------------------------------------------------------------------
ipam:
  mode: kubernetes

# -----------------------------------------------------------------------------
# 5. Hubble 관측성 에이전트 활성화
#    Hubble은 Cilium의 내장 eBPF 기반 네트워크 플로우 가시성 도구입니다.
#    L3-L7 HTTP/DNS 트래픽 관계도를 Hubble UI에서 실시간 시각화합니다.
# -----------------------------------------------------------------------------
hubble:
  enabled: true

  # Hubble Relay: DaemonSet의 분산 Hubble 데이터를 집계하여 Hubble UI에 제공
  relay:
    enabled: true
    replicas: 1

  # Hubble UI: 클러스터 네트워크 플로우 시각화 웹 대시보드
  ui:
    enabled: true
    replicas: 1
    # hubble-ui-nodeport.yaml 에서 별도 NodePort 서비스를 선언하여
    # 외부 브라우저 접근을 허용합니다. (nodePort: 32000)
    service:
      type: ClusterIP  # 헬름 기본 ClusterIP 유지, 외부 노출은 별도 NodePort 서비스로 처리

  # Hubble metrics: Prometheus-compatible 메트릭 수집 활성화 (향후 Grafana 연동 기반)
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http

# -----------------------------------------------------------------------------
# 6. Cilium Operator 리소스 설정
#    K3s 싱글 노드 환경에서는 Operator 복제본 1개로 충분합니다.
# -----------------------------------------------------------------------------
operator:
  replicas: 1

# -----------------------------------------------------------------------------
# 7. Prometheus 메트릭 노출 (선택 - 향후 Grafana 대시보드 연동을 위한 준비)
# -----------------------------------------------------------------------------
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false  # Prometheus Operator가 설치된 경우 true로 변경

# -----------------------------------------------------------------------------
# 8. 보안 강화: BPF 마스커레이드 (NAT 오버헤드 제거)
# -----------------------------------------------------------------------------
bpf:
  masquerade: true
