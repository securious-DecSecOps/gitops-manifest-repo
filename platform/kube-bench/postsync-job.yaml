apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench-postsync
  namespace: kube-bench
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/part-of: secure-k8s-platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bench
        app.kubernetes.io/part-of: secure-k8s-platform
    spec:
      hostPID: true
      serviceAccountName: kube-bench
      restartPolicy: OnFailure
      containers:
        - name: kube-bench
          image: aquasec/kube-bench:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              kube-bench --benchmark k3s-cis-1.7 --json > /output/kube-bench.json || true
              touch /output/kube-bench.done

              cat /output/kube-bench.json
          securityContext:
            privileged: true
          volumeMounts:
            - name: kube-bench-output
              mountPath: /output
            - name: var-lib-rancher
              mountPath: /var/lib/rancher
              readOnly: true
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: etc-passwd
              mountPath: /etc/passwd
              readOnly: true
            - name: etc-group
              mountPath: /etc/group
              readOnly: true
        - name: defectdojo-upload
          image: python:3.12-alpine
          env:
            - name: DEFECTDOJO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: defectdojo-api-token
                  key: token
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-security-slack-webhook
                  key: webhookurl
            - name: DEFECTDOJO_URL
              value: "http://10.0.1.134:8080"
            - name: DEFECTDOJO_ENGAGEMENT_ID
              value: "9"
            - name: KUBE_BENCH_BENCHMARK
              value: "k3s-cis-1.7"
            - name: SCAN_TRIGGER
              value: "ArgoCD PostSync"
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              i=0
              while [ "$i" -lt 300 ]; do
                if [ -f /output/kube-bench.done ]; then
                  break
                fi
                i=$((i + 1))
                sleep 1
              done

              test -f /output/kube-bench.json

              python3 /config/kube-bench-slack-summary.py
          volumeMounts:
            - name: kube-bench-output
              mountPath: /output
            - name: kube-bench-slack-summary
              mountPath: /config
      volumes:
        - name: kube-bench-output
          emptyDir: {}
        - name: kube-bench-slack-summary
          configMap:
            name: kube-bench-slack-summary
        - name: var-lib-rancher
          hostPath:
            path: /var/lib/rancher
            type: DirectoryOrCreate
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
            type: DirectoryOrCreate
        - name: etc-systemd
          hostPath:
            path: /etc/systemd
            type: DirectoryOrCreate
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
            type: DirectoryOrCreate
        - name: etc-passwd
          hostPath:
            path: /etc/passwd
            type: FileOrCreate
        - name: etc-group
          hostPath:
            path: /etc/group
            type: FileOrCreate
