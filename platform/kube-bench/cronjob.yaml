apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-bench
  namespace: kube-bench
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/part-of: secure-k8s-platform
spec:
  # Schedule: Every Monday at 3:00 AM
  schedule: "0 3 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kube-bench
            app.kubernetes.io/part-of: secure-k8s-platform
        spec:
          hostPID: true
          serviceAccountName: kube-bench
          restartPolicy: OnFailure
          containers:
            - name: kube-bench
              image: aquasec/kube-bench:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  kube-bench --benchmark k3s-cis-1.7 --json > /output/kube-bench.json
                  touch /output/kube-bench.done

                  cat /output/kube-bench.json
              securityContext:
                privileged: true
              volumeMounts:
                - name: kube-bench-output
                  mountPath: /output
                - name: var-lib-rancher
                  mountPath: /var/lib/rancher
                  readOnly: true
                - name: var-lib-kubelet
                  mountPath: /var/lib/kubelet
                  readOnly: true
                - name: etc-systemd
                  mountPath: /etc/systemd
                  readOnly: true
                - name: etc-kubernetes
                  mountPath: /etc/kubernetes
                  readOnly: true
                - name: etc-passwd
                  mountPath: /etc/passwd
                  readOnly: true
                - name: etc-group
                  mountPath: /etc/group
                  readOnly: true
            - name: defectdojo-upload
              image: curlimages/curl:8.8.0
              env:
                - name: DEFECTDOJO_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: defectdojo-api-token
                      key: token
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  i=0
                  while [ "$i" -lt 300 ]; do
                    if [ -f /output/kube-bench.done ]; then
                      break
                    fi
                    i=$((i + 1))
                    sleep 1
                  done

                  test -f /output/kube-bench.json

                  curl -fsS -X POST http://10.0.1.134:8080/api/v2/import-scan/ \
                    -H "Authorization: Token ${DEFECTDOJO_API_TOKEN}" \
                    -F "scan_type=kube-bench Scan" \
                    -F "engagement=9" \
                    -F "file=@/output/kube-bench.json"

                  echo "DefectDojo upload success"
              volumeMounts:
                - name: kube-bench-output
                  mountPath: /output
          volumes:
            - name: kube-bench-output
              emptyDir: {}
            - name: var-lib-rancher
              hostPath:
                path: /var/lib/rancher
                type: DirectoryOrCreate
            - name: var-lib-kubelet
              hostPath:
                path: /var/lib/kubelet
                type: DirectoryOrCreate
            - name: etc-systemd
              hostPath:
                path: /etc/systemd
                type: DirectoryOrCreate
            - name: etc-kubernetes
              hostPath:
                path: /etc/kubernetes
                type: DirectoryOrCreate
            - name: etc-passwd
              hostPath:
                path: /etc/passwd
                type: FileOrCreate
            - name: etc-group
              hostPath:
                path: /etc/group
                type: FileOrCreate
