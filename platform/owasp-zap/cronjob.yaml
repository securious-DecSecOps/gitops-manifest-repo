apiVersion: batch/v1
kind: CronJob
metadata:
  name: owasp-zap
  namespace: owasp-zap
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: owasp-zap-sa
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: zap
            image: zaproxy/zap-stable:latest
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                - ALL
            command:
            - /bin/bash
            - -c
            - |
              zap-baseline.py -t http://vulnbank-msa-frontend.secure-path-dev.svc.cluster.local:8080 -c /zap/config/zap-baseline.conf -r report.html
              EXIT_CODE=$?
              echo "=== OWASP ZAP REPORT START ==="
              if [ -f /zap/wrk/report.html ]; then
                cat /zap/wrk/report.html
              else
                echo "Report file not found!"
              fi
              echo "=== OWASP ZAP REPORT END ==="
              # zap-baseline 종료코드: 1=FAIL, 2=WARN (둘 다 '발견'이지 실행오류 아님).
              # 스캔이 돌아갔으면 잡은 성공 처리하고, 3 이상(ZAP 실행/설정 오류)만 실패로 전파한다.
              # (findings 자체는 DefectDojo로 보내 관리 — 잡 실패로 다루지 않는다)
              if [ "${EXIT_CODE}" -ge 3 ]; then exit "${EXIT_CODE}"; fi
              exit 0
            volumeMounts:
            - name: zap-workdir
              mountPath: /zap/wrk
            - name: zap-config
              mountPath: /zap/config
          volumes:
          - name: zap-workdir
            emptyDir: {}
          - name: zap-config
            configMap:
              name: owasp-zap-config
