apiVersion: batch/v1
kind: CronJob
metadata:
  name: owasp-zap
  namespace: owasp-zap
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: owasp-zap-sa
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: zap
            image: zaproxy/zap-stable:latest
            env:
            - name: DEFECTDOJO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: defectdojo-api-token
                  key: token
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-security-slack-webhook
                  key: webhookurl
            - name: DEFECTDOJO_URL
              value: "http://10.0.1.134:8080"
            - name: DEFECTDOJO_ENGAGEMENT_ID
              value: "8"
            - name: TARGET_URL
              value: "http://vulnbank-msa-frontend.secure-path-dev.svc.cluster.local:8080"
            - name: SCAN_TRIGGER
              value: "Scheduled CronJob"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                - ALL
            command:
            - /bin/bash
            - -c
            - |
              zap-baseline.py -t "${TARGET_URL}" -c /zap/config/zap-baseline.conf -r report.html -x report.xml
              EXIT_CODE=$?
              echo "=== OWASP ZAP REPORT START ==="
              if [ -f /zap/wrk/report.html ]; then
                cat /zap/wrk/report.html
              else
                echo "Report file not found!"
              fi
              echo "=== OWASP ZAP REPORT END ==="
              if [ -f /zap/wrk/report.xml ]; then
                python3 /zap/config/zap-slack-summary.py
              else
                echo "ZAP XML report not found; skipping DefectDojo and Slack notification"
              fi
              if [ "${EXIT_CODE}" -ge 3 ]; then exit "${EXIT_CODE}"; fi
              exit 0
            volumeMounts:
            - name: zap-workdir
              mountPath: /zap/wrk
            - name: zap-config
              mountPath: /zap/config
          volumes:
          - name: zap-workdir
            emptyDir: {}
          - name: zap-config
            configMap:
              name: owasp-zap-config
