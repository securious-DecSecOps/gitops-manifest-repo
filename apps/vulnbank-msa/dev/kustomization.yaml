apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD-facing desired state for the VulnBank MSA dev profile.
# ArgoCD may need Kustomize Helm support enabled for this profile.
helmGlobals:
  chartHome: ../../../helm
helmCharts:
  - name: vulnbank-msa
    releaseName: vulnbank-msa
    namespace: secure-path-dev
    valuesFile: values.yaml

