apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This path is the ArgoCD-facing desired state for the dev profile.
# It renders the shared Helm chart with environment-specific values.
# ArgoCD may need Kustomize Helm support enabled for this profile.
helmGlobals:
  chartHome: ../../../../helm
helmCharts:
  - name: simple-web
    releaseName: simple-web
    namespace: secure-path-dev
    valuesFile: values.yaml

