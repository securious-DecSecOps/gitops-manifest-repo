{{- $root := . }}
{{- range $serviceName, $service := .Values.services }}
{{- $defaults := $root.Values.phpServiceDefaults }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName | quote }}
  namespace: {{ $root.Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ $serviceName | quote }}
    app.kubernetes.io/part-of: {{ $root.Values.nameOverride | quote }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $serviceName | quote }}
      app.kubernetes.io/part-of: {{ $root.Values.nameOverride | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $serviceName | quote }}
        app.kubernetes.io/part-of: {{ $root.Values.nameOverride | quote }}
    spec:
      containers:
        - name: {{ $serviceName | quote }}
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $service.image.pullPolicy | quote }}
          ports:
            - containerPort: {{ dig "containerPort" $defaults.containerPort $service }}
          {{- $probePath := dig "probePath" $defaults.probePath $service }}
          readinessProbe:
            httpGet:
              path: {{ $probePath | quote }}
              port: {{ dig "containerPort" $defaults.containerPort $service }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $probePath | quote }}
              port: {{ dig "containerPort" $defaults.containerPort $service }}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          {{- $env := mergeOverwrite (deepCopy $defaults.env) (dig "env" dict $service) }}
          {{- $creds := dig "serviceCredentials" $serviceName (dict) $root.Values.database }}
          {{- if $creds }}
          {{- $_ := set $env "DB_HOST" (dig "dbHost" $root.Values.database.name $creds) }}
          {{- $_ := set $env "DB_NAME" (dig "dbName" "" $creds) }}
          {{- $_ := set $env "DB_USER" (dig "dbUser" "" $creds) }}
          {{- $_ := set $env "DB_PASSWORD" (dig "dbPassword" "" $creds) }}
          {{- end }}
          {{- if $env }}
          env:
            {{- range $envName, $envValue := $env }}
            - name: {{ $envName | quote }}
              value: {{ $envValue | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml (dig "resources" $defaults.resources $service) | nindent 12 }}
{{ end }}
