{{- if .Values.database.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vulnbank-db-init
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: vulnbank-db-init
    app.kubernetes.io/part-of: {{ .Values.nameOverride | quote }}
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Helm CLI hook (helm install/upgrade에서 동작)
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    # ArgoCD sync hook (ArgoCD native Helm deployment에서 동작)
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vulnbank-db-init
        app.kubernetes.io/part-of: {{ .Values.nameOverride | quote }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              until mariadb-admin -h {{ .Values.database.name }} -uroot ping --silent; do
                echo "waiting for vulnbank-db..."
                sleep 2
              done
              for f in $(ls /init/*.sql | sort); do
                echo "running $f"
                mariadb -h {{ .Values.database.name }} -uroot < "$f" || exit 1
              done
              echo "vulnbank-db init done"
          volumeMounts:
            - name: db-init-sql
              mountPath: /init
              readOnly: true
      volumes:
        - name: db-init-sql
          configMap:
            name: vulnbank-db-init-sql
{{- end }}
